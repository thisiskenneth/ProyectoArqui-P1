version: '3.8'

services:
  ms-auth:
    build: ./backend/ms-auth
    ports:
      - "3001:3001"
    environment:
      - NODE_ENV=development

  ms-clientes:
    build: ./backend/ms-clientes
    ports:
      - "3002:3002"

  ms-pedidos:
    build: ./backend/ms-pedidos
    ports:
      - "3003:3003"

  ms-ruteo:
    build: ./backend/ms-ruteo
