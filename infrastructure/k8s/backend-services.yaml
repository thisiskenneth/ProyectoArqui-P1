apiVersion: apps/v1
kind: Deployment
metadata:
  name: graphql-gateway
  namespace: logiflow
spec:
  replicas: 1
  selector:
    matchLabels:
      app: graphql-gateway
  template:
    metadata:
      labels:
        app: graphql-gateway
    spec:
      containers:
        - name: graphql-gateway
          image: proyecto-graphql-gateway:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8080
          env:
            - name: SERVICES_ORDERS_URL
              value: http://ms-pedidos:8087/api/orders
            - name: SERVICES_SHIPMENTS_URL
              value: http://ms-ruteo:8082/api/shipments
            - name: SPRING_RABBITMQ_HOST
              value: rabbitmq
            - name: SPRING_RABBITMQ_PORT
              value: "5672"
---
apiVersion: v1
kind: Service
metadata:
  name: graphql-gateway
  namespace: logiflow
spec:
  selector:
    app: graphql-gateway
  ports:
    - port: 8080
      targetPort: 8080
