apiVersion: apps/v1
kind: Deployment
metadata:
  name: ms-ruteo
  namespace: logiflow
spec:
  replicas: 1
  selector:
    matchLabels:
      app: ms-ruteo
  template:
    metadata:
      labels:
        app: ms-ruteo
    spec:
      containers:
        - name: ms-ruteo
          image: proyecto-ms-ruteo:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8082
          env:
            - name: SPRING_RABBITMQ_HOST
              value: rabbitmq
            - name: SPRING_RABBITMQ_PORT
              value: "5672"
            - name: FLEET_SERVICE_URL
              value: http://ms-flota-rest:8081/api/vehicles/available
            - name: TALLER_SERVICE_URL
              value: http://ms-taller:8089/api/maintenance
---
apiVersion: v1
kind: Service
metadata:
  name: ms-ruteo
  namespace: logiflow
spec:
  selector:
    app: ms-ruteo
  ports:
    - port: 8082
      targetPort: 8082
