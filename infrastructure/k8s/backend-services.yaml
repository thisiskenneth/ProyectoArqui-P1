apiVersion: apps/v1
kind: Deployment
metadata:
  name: ms-auth
  namespace: logiflow
spec:
  replicas: 1
  selector:
    matchLabels:
      app: ms-auth
  template:
    metadata:
      labels:
        app: ms-auth
    spec:
      containers:
        - name: ms-auth
          image: proyecto-ms-auth:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8088
---
apiVersion: v1
kind: Service
metadata:
  name: ms-auth
  namespace: logiflow
spec:
  selector:
    app: ms-auth
  ports:
    - port: 8088
      targetPort: 8088
---
