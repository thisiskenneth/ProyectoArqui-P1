  namespace: logiflow
spec:
  replicas: 1
  selector:
    matchLabels:
      app: ms-pedidos
  template:
    metadata:
      labels:
        app: ms-pedidos
    spec:
      containers:
        - name: ms-pedidos
          image: proyecto-ms-pedidos:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8087
          env:
