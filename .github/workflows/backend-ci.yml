name: Backend CI

on:
  push:
    branches:
      - main
      - development
  pull_request:
    branches:
      - main
      - development

jobs:
  backend:
    runs-on: ubuntu-latest
    env:
      SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
      SONAR_PROJECT_KEY: ${{ secrets.SONAR_PROJECT_KEY }}
      SONAR_ORGANIZATION: ${{ secrets.SONAR_ORGANIZATION }}
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      - name: Compile backend microservices
        run: |
          set -e
          for service in \
            ms-auth \
            ms-clientes \
            ms-flota-rest \
            ms-taller-soap \
            ms-pedidos \
            ms-ruteo \
            ms-seguimiento \
            ms-facturacion \
            ms-notificaciones \
            graphql-gateway
          do
            chmod +x "backend/$service/mvnw"
            (cd "backend/$service" && ./mvnw -B -DskipTests compile)
          done

      - name: SonarCloud analysis
        if: env.SONAR_TOKEN != '' && env.SONAR_PROJECT_KEY != '' && env.SONAR_ORGANIZATION != ''
        uses: SonarSource/sonarqube-scan-action@v6
        env:
          SONAR_TOKEN: ${{ env.SONAR_TOKEN }}
        with:
          args: >
            -Dsonar.projectKey=${{ env.SONAR_PROJECT_KEY }}
            -Dsonar.organization=${{ env.SONAR_ORGANIZATION }}
            -Dsonar.sources=backend
            -Dsonar.java.binaries=backend/ms-auth/target/classes,backend/ms-clientes/target/classes,backend/ms-flota-rest/target/classes,backend/ms-taller-soap/target/classes,backend/ms-pedidos/target/classes,backend/ms-ruteo/target/classes,backend/ms-seguimiento/target/classes,backend/ms-facturacion/target/classes,backend/ms-notificaciones/target/classes,backend/graphql-gateway/target/classes

      - name: Notify Telegram
        if: always()
        run: |
          if [ -z "$TELEGRAM_BOT_TOKEN" ] || [ -z "$TELEGRAM_CHAT_ID" ]; then
            echo "Telegram secrets not configured; skipping notification."
            exit 0
          fi

          STATUS="${{ job.status }}"
          TEXT="LogiFlow backend CI: $STATUS%0ARepo: ${{ github.repository }}%0ABranch: ${{ github.ref_name }}%0ACommit: ${{ github.sha }}%0ARun: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          curl -sS -X POST "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage" \
            -d "chat_id=${TELEGRAM_CHAT_ID}" \
            -d "text=${TEXT}"
